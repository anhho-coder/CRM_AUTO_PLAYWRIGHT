# Auto-load every dashboard JSON in /var/lib/grafana/dashboards into a folder.
apiVersion: 1

providers:
  - name: k6-crm
    orgId: 1
    folder: k6 CRM Load Tests
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
